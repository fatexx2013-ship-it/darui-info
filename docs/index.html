<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大瑞的信息网 · 每日两更</title>
<meta name="description" content="个人自用「大瑞的信息网」：手机动态 / 天津新闻 / 国内新闻 / 国际新闻 / 地缘冲突 / 科技前沿 / 奇闻怪事 / 网络舆论，顶部标签切换板块，每日两更，支持归档检索。">
<link rel="stylesheet" href="styles.css">
<script src="data.js" defer></script>
<script src="archive/index.js" defer></script>
<script src="common.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<div class="bg-glow"></div>

<header class="site-head">
  <div class="wrap head-inner">
    <div class="brand">
      <span class="logo">◈</span>
      <span class="brand-name">大瑞的<em>信息网</em></span>
    </div>
    <nav class="nav" id="nav">
      <a href="#boardTabs">板块</a>
      <a href="#searchPanel">检索</a>
      <a href="archive.html" class="strong">归档检索</a>
      <a href="report.json" target="_blank" rel="noopener" class="hide-sm">抓取报告</a>
    </nav>
  </div>
</header>

<section class="hero wrap">
  <h1>大瑞的<span class="grad">信息网</span></h1>
  <p class="sub">每日两更（北京时间 08:00 / 20:00 由 GitHub Actions 自动抓取）。
     顶部标签一点即切板块，八大板块聚合公开订阅源与热榜，仅存标题与摘要，正文跳转原始来源；自用选题材料库，非对外展示。</p>
  <div class="hero-meta" id="heroMeta"></div>
</section>

<section class="wrap" id="searchPanel">
  <div class="panel">
    <div class="panel-row">
      <input type="text" id="kw" placeholder="在当前选中板块内检索：标题 / 摘要 / 来源，多个词用空格分隔">
      <button class="btn" id="btnSearch">检索</button>
      <button class="btn ghost" id="btnReset">重置</button>
    </div>
    <div class="panel-row">
      <span class="panel-label">范围</span>
      <div class="seg" id="scopeSeg">
        <button data-scope="latest" class="active">仅最新一期</button>
        <button data-scope="archive">含历史归档</button>
      </div>
      <details class="fold" id="advFold">
        <summary>日期区间</summary>
        <div class="fold-body">
          <input type="date" id="from" aria-label="起始日期">
          <span class="panel-label">→</span>
          <input type="date" id="to" aria-label="结束日期">
        </div>
      </details>
      <span id="searchHint" class="hint"></span>
    </div>
    <p class="scope-note" id="scopeNote"></p>
  </div>
</section>

<div class="tabs-wrap">
  <div class="wrap">
    <div class="tabs" id="boardTabs" role="tablist" aria-label="板块切换"></div>
  </div>
</div>

<main class="wrap">
  <section id="results" class="hidden">
    <div class="res-head">
      <h2>检索结果</h2>
      <span class="res-count" id="resCount"></span>
      <button class="btn ghost" id="btnBack" style="margin-left:auto">返回板块</button>
    </div>
    <div id="resBody"></div>
  </section>

  <section id="boardView"></section>
</main>

<footer class="site-foot">
  <div class="wrap">
    <div class="toplinks">
      <a href="archive.html">归档检索</a>
      <a href="report.json" target="_blank" rel="noopener">抓取报告</a>
      <a href="data.json" target="_blank" rel="noopener">最新数据（JSON）</a>
    </div>
    <div>大瑞的信息网 · 数据来自公开 RSS 与公开榜单，仅存标题与摘要，版权归各原始来源所有。</div>
    <p class="foot-tiny" id="footTiny"></p>
  </div>
</footer>

</body>
</html>
